# nginx trước Jenkins (008, FR-041, R6). Lối vào DUY NHẤT từ internet: /github-webhook/ (Jenkins kiểm chữ ký
# bằng bí mật webhook; sai → 403). Mọi đường dẫn khác chỉ nhận từ địa chỉ của đội; còn lại trả 403.
# Danh sách địa chỉ đội: /etc/nginx/admin-cidrs.conf do bootstrap.sh sinh từ biến ADMIN_CIDRS (dạng `allow <cidr>;`).
# Chứng chỉ TLS: /etc/ssl/jenkins/{fullchain.pem,privkey.pem} – cấp bằng certbot hoặc nhà cung cấp (docs/ci-cd/rebuild-jenkins.md).
worker_processes auto;
events { worker_connections 512; }

http {
    server_tokens off;
    client_max_body_size 5m;           # payload webhook của GitHub tối đa 25 MB nhưng sự kiện cần chỉ vài chục KB
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;

    upstream jenkins { server 127.0.0.1:8080; keepalive 8; }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/ssl/jenkins/fullchain.pem;
        ssl_certificate_key /etc/ssl/jenkins/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;

        # --- Webhook GitHub: mở cho internet; chỉ nhận POST; có giới hạn tốc độ ---
        location = /github-webhook/ {
            limit_except POST { deny all; }
            limit_req zone=webhook burst=40 nodelay;
            proxy_pass http://jenkins;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- Mọi đường dẫn khác: chỉ địa chỉ của đội (đăng nhập GitHub OAuth ở Jenkins) ---
        location / {
            include /etc/nginx/admin-cidrs.conf;
            deny all;
            proxy_pass http://jenkins;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90s;
            proxy_buffering off;       # luồng nhật ký dựng theo thời gian thực
        }
    }
}
