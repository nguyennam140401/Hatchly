# Job và thư mục KHÔNG tạo bằng giao diện: Job DSL nạp mọi tệp trong ops/ci/jenkins/jobs/*.groovy
# (gắn vào bộ điều khiển ở /var/jenkins_jobs, xem compose.yaml). Thêm job = thêm tệp .groovy qua pull request.
jobs:
  - file: /var/jenkins_jobs/folders.groovy
  - file: /var/jenkins_jobs/ci_gates.groovy
  - file: /var/jenkins_jobs/ci_sandbox.groovy
  - file: /var/jenkins_jobs/deploy.groovy
  - file: /var/jenkins_jobs/redeploy.groovy
  - file: /var/jenkins_jobs/maintenance_ruleset_drift.groovy
  - file: /var/jenkins_jobs/maintenance_prune_web.groovy
  - file: /var/jenkins_jobs/maintenance_prune_images.groovy
  - file: /var/jenkins_jobs/maintenance_credential_age.groovy
