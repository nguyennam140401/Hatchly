# Thông tin xác thực – khai báo THEO THƯ MỤC (008, data-model.md mục 6, R3). Giá trị đọc từ tệp trong
# /etc/jenkins-secrets/ (do SA nhập tay lần đầu – docs/ci-cd/credentials.md); KHÔNG có giá trị nào trong kho mã.
# Không có thông tin ở phạm vi toàn cục: job ngoài thư mục tương ứng không thấy được (FR-039, FR-040).
# Jenkins KHÔNG giữ: mật khẩu vai trò owner/app/system/support, khóa kho tệp media, khóa KMS.
#
# Mỗi thư mục mang credential cùng MÃ ĐỊNH DANH nhưng khác GIÁ TRỊ ở staging và production: job triển khai
# viết giống hệt nhau và Jenkins chọn đúng giá trị theo thư mục chứa job.
# CHƯA KIỂM CHỨNG TRÊN JENKINS THẬT (T052/T054): khối `folder:` dưới đây mô tả ý định (kho thông tin theo thư
# mục). Nếu JCasC của bản đã cố định không nạp được khối này, chuyển sang `folderCredentialsProperty` trong
# Job DSL (ops/ci/jenkins/jobs/folders.groovy) – ràng buộc không đổi: mã định danh giống nhau, giá trị theo thư mục.
credentials:
  system:
    domainCredentials: []
folder:
  # Các thư mục do Job DSL tạo (jobs/folders.groovy); JCasC gắn kho thông tin vào từng thư mục.
  - path: 'ci'
    credentials:
      - githubApp:
          scope: GLOBAL
          id: 'github-app-ci'
          description: 'GitHub App "ci": đọc nội dung + pull request, ghi Checks, đọc Deployments'
          appID: '${readFile:/etc/jenkins-secrets/github-app-ci-id}'
          privateKey: '${readFile:/etc/jenkins-secrets/github-app-ci-key}'
  - path: 'deploy'
    credentials:
      - githubApp:
          scope: GLOBAL
          id: 'github-app-deploy'
          description: 'GitHub App "deploy": ghi nhánh backmerge/*, pull request, Deployments'
          appID: '${readFile:/etc/jenkins-secrets/github-app-deploy-id}'
          privateKey: '${readFile:/etc/jenkins-secrets/github-app-deploy-key}'
      - string:
          scope: GLOBAL
          id: 'telegram-bot-token'
          description: 'Mã bot Telegram'
          secret: '${readFile:/etc/jenkins-secrets/telegram-bot-token}'
      - string:
          scope: GLOBAL
          id: 'telegram-chat-id'
          description: 'Mã nhóm Telegram nhận thông báo'
          secret: '${readFile:/etc/jenkins-secrets/telegram-chat-id}'
  - path: 'maintenance'
    # Thư mục anh em của deploy/ (không kế thừa): việc định kỳ chỉ nhận đúng thứ cần – đọc mã (App "ci", thêm
    # quyền Administration: đọc để so luật bảo vệ nhánh) và gửi Telegram. KHÔNG có thông tin của môi trường nào.
    credentials:
      - githubApp:
          scope: GLOBAL
          id: 'github-app-ci'
          description: 'GitHub App "ci": đọc mã + đọc luật bảo vệ nhánh (job maintenance)'
          appID: '${readFile:/etc/jenkins-secrets/github-app-ci-id}'
          privateKey: '${readFile:/etc/jenkins-secrets/github-app-ci-key}'
      - string:
          scope: GLOBAL
          id: 'telegram-bot-token'
          description: 'Mã bot Telegram'
          secret: '${readFile:/etc/jenkins-secrets/telegram-bot-token}'
      - string:
          scope: GLOBAL
          id: 'telegram-chat-id'
          description: 'Mã nhóm Telegram nhận thông báo'
          secret: '${readFile:/etc/jenkins-secrets/telegram-chat-id}'
  - path: 'deploy/staging'
    credentials: &env_credentials_staging
      - usernamePassword:
          scope: GLOBAL
          id: 'registry'
          description: 'Kho ảnh test: đẩy / kéo / xóa'
          username: '${readFile:/etc/jenkins-secrets/staging/registry-user}'
          password: '${readFile:/etc/jenkins-secrets/staging/registry-password}'
      - string:
          scope: GLOBAL
          id: 'kubeconfig'
          description: 'Mã ServiceAccount ci-deployer của cụm test'
          secret: '${readFile:/etc/jenkins-secrets/staging/kubeconfig}'
      - usernamePassword:
          scope: GLOBAL
          id: 'static-site'
          description: 'Khóa S3 của kho tệp tĩnh test (chỉ kho đó)'
          username: '${readFile:/etc/jenkins-secrets/staging/static-site-key-id}'
          password: '${readFile:/etc/jenkins-secrets/staging/static-site-secret}'
      - usernamePassword:
          scope: GLOBAL
          id: 'smoke'
          description: 'Mã kiểm tra khói + tài khoản kiểm tra nội bộ của test'
          username: '${readFile:/etc/jenkins-secrets/staging/smoke-account}'
          password: '${readFile:/etc/jenkins-secrets/staging/smoke-token}'
  - path: 'deploy/production'
    credentials:
      - usernamePassword:
          scope: GLOBAL
          id: 'registry'
          description: 'Kho ảnh release: đẩy / kéo / xóa'
          username: '${readFile:/etc/jenkins-secrets/production/registry-user}'
          password: '${readFile:/etc/jenkins-secrets/production/registry-password}'
      - string:
          scope: GLOBAL
          id: 'kubeconfig'
          description: 'Mã ServiceAccount ci-deployer của cụm release'
          secret: '${readFile:/etc/jenkins-secrets/production/kubeconfig}'
      - usernamePassword:
          scope: GLOBAL
          id: 'static-site'
          description: 'Khóa S3 của kho tệp tĩnh release (chỉ kho đó)'
          username: '${readFile:/etc/jenkins-secrets/production/static-site-key-id}'
          password: '${readFile:/etc/jenkins-secrets/production/static-site-secret}'
      - usernamePassword:
          scope: GLOBAL
          id: 'smoke'
          description: 'Mã kiểm tra khói + tài khoản kiểm tra nội bộ của release'
          username: '${readFile:/etc/jenkins-secrets/production/smoke-account}'
          password: '${readFile:/etc/jenkins-secrets/production/smoke-token}'
