# Chạy toàn bộ dự án bằng container trên máy cục bộ.
#   docker compose up --build -d          # web + api + worker
#   docker compose --profile db up -d     # thêm PostgreSQL (dùng từ WBS 1.2 – lớp CSDL)
#   docker compose logs -f api worker
#   docker compose down                   # thêm -v để xóa dữ liệu PostgreSQL
#
# Mở ứng dụng: http://localhost:8080   ·   API trực tiếp: http://localhost:3000/healthz
# Worker kiểm tra sống: http://localhost:3001/healthz
#
# API và Worker dùng CHUNG một ảnh (ADR-01), chỉ khác lệnh khởi động.
# Môi trường chính thức chạy trên Kubernetes – file này chỉ phục vụ phát triển/thử nghiệm.

x-server-env: &server-env
  APP_ENV: development
  APP_VERSION: ${APP_VERSION:-0.0.0-compose}
  API_PORT: '3000'
  WORKER_HEALTH_PORT: '3001'
  SHUTDOWN_TIMEOUT_MS: '30000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-server:local
    environment: *server-env
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 35s # > SHUTDOWN_TIMEOUT_MS để tắt có kiểm soát
    restart: unless-stopped

  worker:
    image: app-server:local # cùng ảnh với api
    command: ['node', 'dist/worker.js']
    environment: *server-env
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 35s
    depends_on:
      api:
        condition: service_started # chỉ để ảnh được build trước
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: app-web:local
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Chưa có mã nào dùng – bật bằng `--profile db` khi làm WBS 1.2 / 1.3.
  postgres:
    profiles: ['db']
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
