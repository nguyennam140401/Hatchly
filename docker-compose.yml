# Chạy toàn bộ dự án bằng container trên máy cục bộ.
#   docker compose up --build -d          # postgres + migrate (một lần) + web + api + worker
#   docker compose up -d postgres         # chỉ PostgreSQL (= pnpm db:up), rồi pnpm db:setup
#   docker compose logs -f api worker
#   docker compose down                   # thêm -v để xóa dữ liệu PostgreSQL
#
# Mở ứng dụng: http://localhost:8080   ·   API trực tiếp: http://localhost:3000/healthz
# Hộp thư dev (Mailpit): http://localhost:8025
# Kho tệp dev (MinIO, S3): API http://localhost:9000, console http://localhost:9001
# MinIO và Mailpit CHỈ dùng ở dev – không có trong hạ tầng thật (thật: S3 + SES của nhà cung cấp, 005).
# Worker kiểm tra sống: http://localhost:3001/healthz
#
# API và Worker dùng CHUNG một ảnh (ADR-01), chỉ khác lệnh khởi động. Dịch vụ `migrate` (cùng ảnh)
# tạo 4 vai trò CSDL + áp migration trước khi api/worker khởi động (WBS 1.2).
# Mật khẩu *_dev_only CHỈ dùng cục bộ – không bao giờ dùng ở môi trường thật.
# Môi trường chính thức chạy trên Kubernetes – file này chỉ phục vụ phát triển/thử nghiệm.

x-server-env: &server-env
  APP_ENV: development
  APP_VERSION: ${APP_VERSION:-0.0.0-compose}
  API_PORT: '3000'
  WORKER_HEALTH_PORT: '3001'
  SHUTDOWN_TIMEOUT_MS: '30000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  DATABASE_APP_URL: postgres://app:app_dev_only@postgres:5432/app
  DATABASE_SYSTEM_URL: postgres://system:system_dev_only@postgres:5432/app
  DATABASE_SUPPORT_URL: postgres://support:support_dev_only@postgres:5432/app
  # Xác thực (004, contracts/auth-ops.md mục 1) – API đọc, Worker bỏ qua. dev_only CHỈ dùng cục bộ.
  WEB_BASE_URL: http://localhost:8080
  WEB_ORIGINS: http://localhost:8080,http://localhost:5173
  AUTH_THROTTLE_SECRET: dev_only_auth_throttle_secret_0123456789abcdef
  TERMS_VERSION: '2026-11'
  MAIL_TRANSPORT: smtp
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: '"App" <no-reply@example.test>'
  # Cổng + bản giả lập (005, contracts/runtime-config.md). Bản giả lập bị từ chối ở staging/production.
  PLATFORM_GATEWAY_DRIVER: fake
  AI_GATEWAY_DRIVER: fake
  NOTIFICATIONS_DRIVER: fake
  FAKE_STATE_STORE: sandbox
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  # Đường dẫn ký sẵn cho trình duyệt dùng địa chỉ máy chủ của nhà phát triển.
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: app-dev
  S3_ACCESS_KEY_ID: minio_dev_only
  S3_SECRET_ACCESS_KEY: minio_secret_dev_only
  S3_FORCE_PATH_STYLE: 'true'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-server:local
    environment: *server-env
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 35s # > SHUTDOWN_TIMEOUT_MS để tắt có kiểm soát
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  worker:
    image: app-server:local # cùng ảnh với api
    command: ['node', 'dist/worker.js']
    environment: *server-env
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 35s
    depends_on:
      api:
        condition: service_started # chỉ để ảnh được build trước
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: app-web:local
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Bootstrap vai trò + migrate một lần (= pnpm db:setup), cùng ảnh với api/worker.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-server:local
    command: ['node', 'dist/db/setup-dev.js']
    environment:
      APP_ENV: development
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@postgres:5432/app
      DATABASE_OWNER_URL: postgres://owner:owner_dev_only@postgres:5432/app
      DB_ROLE_PASSWORD_OWNER: owner_dev_only
      DB_ROLE_PASSWORD_APP: app_dev_only
      DB_ROLE_PASSWORD_SYSTEM: system_dev_only
      DB_ROLE_PASSWORD_SUPPORT: support_dev_only
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Hộp thư giả CHỈ DÙNG CHO DEV (004, R9): nhận SMTP ở cổng 1025, xem thư ở http://localhost:8025.
  # Không có trong hạ tầng thật – môi trường thật gửi qua Amazon SES (SMTP).
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - '1025:1025'
      - '8025:8025'
    restart: unless-stopped

  # Kho tệp S3 CHỈ DÙNG CHO DEV (005, R13): MinIO RELEASE.2025-04-22 (bản đóng gói bitnamilegacy – ảnh
  # minio/minio không còn phát hành công khai). Hỗ trợ POST policy + luật vòng đời theo nhãn.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: minio_dev_only
      MINIO_ROOT_PASSWORD: minio_secret_dev_only
      # MinIO cấu hình CORS theo máy chủ (không theo bucket): chỉ SPA dev được gọi trực tiếp.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080,http://localhost:5173
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Một lần: bucket app-dev, CORS cho SPA dev, luật vòng đời xóa tệp tạm (nhãn lifecycle=tmp) sau 1 ngày.
  # Tệp tạm nằm ở tenants/{acc}/tmp/{jobId}/… nên không lọc được theo tiền tố – lọc theo nhãn đối tượng.
  minio-init:
    image: bitnamilegacy/minio-client:2025.4.16
    entrypoint: ['/bin/sh', '/init/minio-init.sh']
    environment:
      MINIO_URL: http://minio:9000
      MINIO_USER: minio_dev_only
      MINIO_PASSWORD: minio_secret_dev_only
      BUCKET: app-dev
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - ./ops/dev/minio-init.sh:/init/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  # PostgreSQL cục bộ. Phiên bản đổi được bằng POSTGRES_IMAGE cho khớp môi trường thật (tối thiểu 13).
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
