# Phục vụ SPA. Hai khối phụ thuộc môi trường được sinh lúc khởi động bởi
# docker-entrypoint.d/15-web-config.sh (007, T013):
#  - api-proxy.conf: chuyển tiếp /api, /healthz, /readyz sang API – CHỈ khi đặt API_UPSTREAM (docker compose,
#    giống proxy của Vite dev nên trình duyệt chỉ gọi cùng nguồn). Môi trường thật không đặt → không có khối này.
#  - robots.conf: `X-Robots-Tag: noindex, nofollow` khi SEARCH_INDEXING=false (mặc định).
# `add_header` trong một `location` thay thế mọi `add_header` ở cấp ngoài, nên robots.conf được include trong
# từng `location` cần phát tệp.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  include /etc/nginx/web-includes/api-proxy.conf;

  # Tệp đã băm tên → cache lâu.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/web-includes/robots.conf;
    try_files $uri =404;
  }

  # Định tuyến phía trình duyệt: đường dẫn không phải tệp → index.html.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/web-includes/robots.conf;
    try_files $uri $uri/ /index.html;
  }
}
