apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      serviceAccountName: api
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # người dùng `node` của ảnh
      terminationGracePeriodSeconds: 35
      # Trải khác máy (SC-007): mất một máy vẫn còn bản chạy.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api }
      containers:
        - name: api
          image: server # thay bằng digest ở overlays/<env>/images.yaml
          command: ['node', 'dist/api.js']
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: app-config-base }
            - configMapRef: { name: app-config-env }
            - secretRef: { name: api-secrets }
          env:
            - { name: DATABASE_POOL_MAX, value: '10' }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
